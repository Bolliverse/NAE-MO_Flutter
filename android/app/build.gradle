plugins {
    id "com.android.application"
    id "com.google.gms.google-services"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def appCompileSdkVersion = providers.gradleProperty("app.compileSdkVersion").get().toInteger()
def appMinSdkVersion = providers.gradleProperty("app.minSdkVersion").get().toInteger()
def appNdkVersion = providers.gradleProperty("app.ndkVersion").get()

android {
    namespace = "com.bolliverse.todo.todo_project"
    compileSdk = appCompileSdkVersion
    ndkVersion = appNdkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.bolliverse.todo.todo_project"
        minSdkVersion = appMinSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
