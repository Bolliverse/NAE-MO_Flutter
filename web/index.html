<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="nae_mo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>nae_mo</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- drift WebDatabase requires sql.js (SQLite compiled to WebAssembly) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.12.0/sql-wasm.js"></script>
  <script>
    // drift calls initSqlJs() without locateFile, so we wrap it to inject the CDN path.
    (function () {
      const _base = 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.12.0/';
      const _orig = window.initSqlJs;
      window.initSqlJs = function (cfg) {
        cfg = Object.assign({}, cfg, {
          locateFile: function (filename) { return _base + filename; }
        });
        return _orig(cfg);
      };
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
