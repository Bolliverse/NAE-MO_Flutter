name: nae_mo
description: "NAE-MO Flutter Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.6.2

  # Data Classes
  freezed_annotation: ^2.4.2
  json_annotation: ^4.9.0

  # Network
  dio: ^5.8.0+1
  retrofit: ^4.4.1

  # Local Storage

  # UI
  flutter_svg: ^2.0.16
  cached_network_image: ^3.4.1

  # Local Database
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.0
  uuid: ^4.5.3

  # Utils
  intl: ^0.19.0
  logger: ^2.5.0
  equatable: ^2.0.7
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code Generation
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  freezed: ^2.4.7
  json_serializable: ^6.8.0
  retrofit_generator: ^8.2.1
  drift_dev: ^2.22.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/PretendardVariable.ttf
